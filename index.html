<script>
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&location.hostname!=='localhost'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)window.__upd=1})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{}));
  let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl||!window.__upd)return;rl=true;location.reload()});
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="description" content="Lumen — discover, track and sync what you watch.">
<title>Lumen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="#/" aria-label="Lumen home">Lumen<i></i></a>
  <nav class="links" id="links">
    <a href="#/" data-tab="home">Home</a>
    <a href="#/discover" data-tab="discover">Discover</a>
    <a href="#/explore" data-tab="explore">Search</a>
    <a href="#/library" data-tab="library">My List</a>
  </nav>
  <div class="nav-r"><button class="ib" id="avatarBtn" aria-label="Settings"></button></div>
</header>

<main id="views">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-discover"></section>
  <section class="view pt" id="v-explore"></section>
  <section class="view pt" id="v-feed"></section>
  <section class="view pt" id="v-library"></section>
</main>

<nav class="dock" id="dock" aria-label="Primary">
  <div class="dock-pill">
    <a href="#/" data-tab="home" aria-label="Home"><span data-ic="home"></span><b>Home</b></a>
    <a href="#/discover" data-tab="discover" aria-label="Discover"><span data-ic="reel"></span><b>Discover</b></a>
    <a href="#/library" data-tab="library" aria-label="My List"><span data-ic="list"></span><b>My List</b></a>
  </div>
  <a class="dock-search" href="#/explore" data-tab="explore" aria-label="Search"><span data-ic="search"></span></a>
</nav>

<div class="detail" id="detail" aria-hidden="true"></div>
<div class="sheet-wrap" id="sheetWrap"><div class="scrim" id="scrim"></div><aside class="sheet" id="sheet"></aside></div>
<div class="modal" id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="icons.js"></script>
<script src="core.js"></script>
<script src="sheet.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&location.hostname!=='localhost')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
